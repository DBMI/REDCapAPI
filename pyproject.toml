[project]
name = "redcapapi"
version = "1.6.3"
description = "A Python wrapper around the REDCap API."
license = {file = 'LICENSE'}
readme = "README.md"
authors = [
    {name = "Kevin J. Delaney", email = "<kjdelaney@health.ucsd.edu>"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
documentation = "https://github.com/DBMI/REDCapAPI"
homepage = "https://github.com/DBMI/REDCapAPI"
repository = "https://github.com/DBMI/REDCapAPI"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py311"]
include = '\.pyi?$'

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
disable_error_code = ["call-arg", "call-overload", "import", "var-annotated"]

[tool.poetry]
package-mode = false
packages = [
    { include = "redcapmatchresolver", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11, <4.0"
pandas = ">=2.2.0"
redcaputilities = {git = "https://github.com/DBMI/REDCapUtilities.git"}
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
anybadge = "*"
autoflake = "*"
black = "*"
faker = "*"
flake8 = "*"
flake8-bugbear = "*"
flake8-builtins = "*"
flake8-comprehensions = "*"
flake8-debugger = "*"
flake8-eradicate = "*"
flake8-logging-format = "*"
genbadge = "*"
isort = "*"
make = "*"
mkdocs = "*"
mkdocstrings = "*"
mkdocs-material = "*"
mypy = "*"
pandas = "*"
pep8-naming = "*"
pre-commit = "*"
pymdown-extensions = "*"
pylint = "*"
pytest = "*"
pytest-github-actions-annotate-failures = "*"
pytest-cov = "*"
python-kacl = "*"
pyupgrade = "*"
setuptools = "*"
sphinx = "*"
sphinx_markdown_builder = "*"
tryceratops = "*"
typing = "3.7.4.3"
typing-extensions = "^4.16.0"
wheel = "*"

[tool.poetry.group.test.dependencies]
faker = "^15.3.4"
openpyxl = "^3.1.5"
requests-mock = "*"

[tool.pylint.format]
max-line-length = "88"

[tool.pytest.ini_options]
addopts = """\
    --cov-report term-missing \
    --no-cov-on-fail \
"""
pythonpath = [".", "src", "src/redcap_api"]
testpaths= ["redcap_api"]