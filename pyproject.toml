[project]
name = "redcapapi"
version = "1.6.6"
description = "A Python wrapper around the REDCap API."
license = {file = 'LICENSE'}
readme = "README.md"
authors = [
    {name = "Kevin J. Delaney", email = "<kjdelaney@health.ucsd.edu>"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
documentation = "https://github.com/DBMI/REDCapAPI"
homepage = "https://github.com/DBMI/REDCapAPI"
repository = "https://github.com/DBMI/REDCapAPI"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]

[tool.ruff]
# Target Python version
target-version = "py311"
# Only look at your specific source directory
src = ["src/redcapapi"]

[tool.ruff.lint]
# E/W = Flake8 errors/warnings, F = Pyflakes, I = Isort, G = Flake8-Logging-Format
select = ["E", "W", "F", "I", "G"]
ignore = []

# Exclude your tests directory just like your old flake8 config
exclude = ["tests"]

[tool.ruff.lint.isort]
# Keeps your imports sorted exactly how isort did
combine-as-imports = true

[tool.poetry]
package-mode = true
packages = [
    { include = "redcapapi", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11, <4.0"
pandas = ">=2.2.0"
redcaputilities = {git = "https://github.com/DBMI/REDCapUtilities.git"}
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
anybadge = "*"
autoflake = "*"
faker = "*"
genbadge = "*"
make = "*"
mkdocs = "*"
mkdocstrings = "*"
mkdocs-material = "*"
pandas = "*"
pep8-naming = "*"
pre-commit = "*"
pymdown-extensions = "*"
pylint = "*"
pytest = "*"
pytest-github-actions-annotate-failures = "*"
pytest-cov = "*"
python-kacl = "*"
pyupgrade = "*"
ruff = "*"
setuptools = "<82"
sphinx = "*"
sphinx_markdown_builder = "*"
typing = "3.7.4.3"
typing-extensions = "^4.16.0"
usaddress = "*"
wheel = "*"

[tool.poetry.group.test.dependencies]
faker = "^15.3.4"
openpyxl = "^3.1.5"
requests-mock = "*"

[tool.pylint.format]
max-line-length = "88"

[tool.pytest.ini_options]
addopts = """\
    --cov-report term-missing \
    --no-cov-on-fail \
"""
pythonpath = [".", "src", "src/redcap_api"]
testpaths= ["tests"]